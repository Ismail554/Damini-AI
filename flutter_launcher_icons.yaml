# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icons/raw_logo.png"

  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#07204A"
  adaptive_icon_foreground: "assets/icons/raw_logo.png"
  adaptive_icon_monochrome: "assets/icons/raw_logo.png"

  ios: true
  remove_alpha_ios: true
  background_color_ios: "#07204A"
  image_path_ios_dark_transparent: "assets/icons/raw_logo.png"
  image_path_ios_tinted_grayscale: "assets/icons/raw_logo.png"
  desaturate_tinted_to_grayscale_ios: true

  web:
    generate: true
    image_path: "assets/icons/raw_logo.png"
    background_color: "#07204A"
    theme_color: "#07204A"

  macos:
    generate: true
    image_path: "assets/icons/raw_logo.png"
