name: Braintech
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.1.1
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1
  flutter_screenutil: ^5.9.3
  google_fonts: ^8.1.0
  cupertino_native: ^0.1.1
  lottie: ^3.5.1
  flutter_svg: ^2.0.10+1
  go_router: ^17.3.0
  file_picker: ^11.0.2
  image_picker: ^1.2.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svgs/
    - assets/lottie/

flutter_native_splash:
  color: "#050E17"
  image: assets/icons/app_logo.png
  color_dark: "#050E17"
  image_dark: assets/icons/app_logo.png
  fullscreen: true

  android_12:
    image: assets/icons/app_logo.png
    icon_background_color: "#050E17"
    color: "#050E17"
    image_dark: assets/icons/app_logo.png
    icon_background_color_dark: "#050E17"
    color_dark: "#050E17"



